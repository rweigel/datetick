[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "datetick"
version = "0.9.10"
authors = [
  {name = "Bob Weigel", email = "rweigel@gmu.edu"},
  {name = "Brendan Gallagher"},
]
description = "Sensible date tick locator for matplotlib"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
dependencies = [
  "matplotlib",
  "jsonschema",
  "msvc-runtime; platform_system == 'Windows' and python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/rweigel/datetick/"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
datetick = ["rules.json"]

[tool.pytest.ini_options]
markers = [
  "short: quick smoke test (run with -m short)",
]
filterwarnings = [
  "ignore::DeprecationWarning:matplotlib",
  "ignore::matplotlib.MatplotlibDeprecationWarning",
]
